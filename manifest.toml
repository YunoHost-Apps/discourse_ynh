#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "discourse"
name = "Discourse"
description.en = "Discussion platform"
description.fr = "Plateforme de discussion"

version = "2026.7.1~ynh1"

maintainers = ["JimboJoe"]

[upstream]
license = "GPL-2.0"
website = "http://Discourse.org"
demo = "https://try.discourse.org"
code = "https://github.com/discourse/discourse"
cpe = "cpe:2.3:a:discourse:discourse"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = true
sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "1G"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/forum"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

    [install.admin]
    type = "user"

[resources]
    [resources.sources]
    [resources.sources.main]
    url = "https://github.com/discourse/discourse/archive/refs/tags/v2026.7.1.tar.gz"
    sha256 = "ac49170975787395e51afe93439c04cea814c2fe796375392d9a7bee5f448b24"

    autoupdate.strategy = "latest_github_tag"

    [resources.sources.ldap-auth]
    url = "https://github.com/jonmbake/discourse-ldap-auth/archive/9776c1d021696e5bfdb8857093b8434063bc6ae1.tar.gz"
    sha256 = "6007f2762934f248796a9feef009cab86ff91ad31a49d7bf736479c58520eaee"

    autoupdate.strategy = "latest_github_commit"
    autoupdate.upstream = "https://github.com/jonmbake/discourse-ldap-auth"

    [resources.sources.imagemagickv7]
    amd64.url = "https://github.com/orhtej2/imagemagick-binary/releases/download/7.1.2-29/imagemagick-7.1.2-29-linux-amd64.tar.gz"
    amd64.sha256 = "cf194bc652c5555e4c6a45e06c262db56dde3032024b4ec3d65263668d090e66"
    arm64.url = "https://github.com/orhtej2/imagemagick-binary/releases/download/7.1.2-29/imagemagick-7.1.2-29-linux-arm64.tar.gz"
    arm64.sha256 = "5ee02707fad2e764013603abc257aae411ea320bb72ec8b8cb4598b5ed2d924f"
    autoupdate.strategy = "latest_github_release"
    autoupdate.upstream = "https://github.com/orhtej2/imagemagick-binary"
    autoupdate.asset.amd64 = "imagemagick-\\d+\\.\\d+\\.\\d+-\\d+-linux-amd64\\.tar\\.gz$"
    autoupdate.asset.arm64 = "imagemagick-\\d+\\.\\d+\\.\\d+-\\d+-linux-arm64\\.tar\\.gz$"

    [resources.sources.oxipng]
    amd64.url = "https://github.com/oxipng/oxipng/releases/download/v10.1.1/oxipng-10.1.1-x86_64-unknown-linux-gnu.tar.gz"
    amd64.sha256 = "5988392e88fc3d03f562f2d565e5c12a095223ae8bd983576f2aaff2fadf3738"

    arm64.url = "https://github.com/oxipng/oxipng/releases/download/v10.1.1/oxipng-10.1.1-aarch64-unknown-linux-gnu.tar.gz"
    arm64.sha256 = "a69c9dbb110463746153bf9b56488a293747e1d90dc1f30d24af3d9615165b98"

    autoupdate.strategy = "latest_github_release"
    autoupdate.upstream = "https://github.com/shssoichiro/oxipng"
    autoupdate.asset.amd64 = "^oxipng-.*-x86_64-unknown-linux-gnu\\.tar\\.gz$"
    autoupdate.asset.arm64 = "^oxipng-.*-aarch64-unknown-linux-gnu\\.tar\\.gz$"

    [resources.system_user]
    allow_email = true

    [resources.install_dir]
    group = "www-data:r-x"

    [resources.permissions]
    main.url = "/"

    [resources.apt]
    packages = [
        "advancecomp",
        "brotli",
        "cmake",
        "g++",
        "gifsicle",
        "jhead",
        "jpegoptim",
        "libapr1-dev",
        "libcurl4-openssl-dev",
        "libjemalloc-dev",
        "libjemalloc2",
        "libjpeg-turbo-progs",
        "libpq-dev",
        "libreadline-dev",
        "libssl-dev",
        "libtcmalloc-minimal4",
        "libunwind-dev",
        "libxml2-dev",
        "libxslt1-dev",
        "libyaml-dev",
        "optipng",
        "pngcrush",
        "pngquant",
        "redis-server",
        "zlib1g-dev",
        "libffi-dev",

        "postgresql",
        "postgresql-client",
        "postgresql-contrib",
    ]
    packages_from_raw_bash = """
        if [[ $YNH_DEBIAN_VERSION == "trixie" ]]; then
            echo "postgresql-17-pgvector";
        fi
    """
    
    [resources.apt.extras.postgresql]
    repo = "deb https://apt.postgresql.org/pub/repos/apt __YNH_DEBIAN_VERSION__-pgdg main"
    key = "https://www.postgresql.org/media/keys/ACCC4CF8.asc"
    packages_from_raw_bash = """
        if [[ $YNH_DEBIAN_VERSION == "bookworm" ]]; then
            echo "postgresql-15-pgvector";
        else echo "";
        fi
    """

    [resources.database]
    type = "postgresql"

    [resources.nodejs]
    version = "22"

    [resources.ruby]
    version = "3.4"
