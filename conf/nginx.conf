  # maximum file upload size (keep up to date when changing the corresponding site setting)
  client_max_body_size 10m;

  # extend timeouts
  proxy_connect_timeout       600;
  proxy_send_timeout          600;
  proxy_read_timeout          600;
  send_timeout                600;

  # path to discourse's public directory
  set $public __INSTALL_DIR__/discourse/public/;

  # without weak etags we get zero benefit from etags on dynamically compressed content
  # further more etags are based on the file in nginx not sha of data
  # use dates, it solves the problem fine even cross server
  etag off;

  # prevent direct download of backups
  location ^~ __PATH__/backups/ {
    internal;
  }

  # bypass rails stack with a cheap 204 for favicon.ico requests
  location __PATH__/favicon.ico {
    return 204;
    access_log off;
    log_not_found off;
  }

#sub_path_only rewrite ^__PATH__$ __PATH__/ permanent;
  location __PATH__/ {
    alias __INSTALL_DIR__/discourse/public/ ;
    proxy_hide_header ETag;

    # auth_basic on;
    # auth_basic_user_file /etc/nginx/htpasswd;

    # proxy_set_header directives are inherited from the previous configuration
    # level if and only if there are no proxy_set_header directives defined on
    # the current level.
    include proxy_params_no_auth;
    
    proxy_set_header X-Request-Start "t=${msec}";

    proxy_set_header X-Sendfile-Type "";
    proxy_set_header X-Accel-Mapping "";
    proxy_set_header Client-Ip "";

    location ~ ^__PATH__/uploads/short-url/ {
      proxy_pass http://unix:__INSTALL_DIR__/discourse/tmp/sockets/unicorn.sock;
      break;
    }

    location ~ ^__PATH__/(secure-media-uploads/|secure-uploads)/ {
      proxy_pass http://unix:__INSTALL_DIR__/discourse/tmp/sockets/unicorn.sock;
      break;
    }

    location ~* (fonts|assets|plugins|uploads)/.*\.(eot|ttf|woff|woff2|ico|otf)$ {
      expires 1y;
      more_set_headers "Cache-Control : public,immutable";
      more_set_headers "Access-Control-Allow-Origin : *";
     }

    location = __PATH__/srv/status {
      access_log off;
      log_not_found off;
      proxy_pass http://unix:__INSTALL_DIR__/discourse/tmp/sockets/unicorn.sock;
      include proxy_params_no_auth;
      break;
    }

    # some minimal caching here so we don't keep asking
    # longer term we should increase probably to 1y
    location ~ ^/javascripts/ {
      expires 1d;

      more_set_headers "Cache-Control : public,immutable";
      more_set_headers "Access-Control-Allow-Origin : *";
    }

    location ~ ^/assets/(?<asset_path>.+)$ {
      expires 1y;
      # asset pipeline enables this
      # brotli_static on;
      gzip_static on;
      more_set_headers "Cache-Control : public,immutable";
      more_set_headers "Access-Control-Allow-Origin : *";
      # HOOK in asset location (used for extensibility)
      # TODO I don't think this break is needed, it just breaks out of rewrite
      break;
    }

    location ~ ^/plugins/ {
      expires 1y;
      more_set_headers "Cache-Control : public,immutable";
      more_set_headers "Access-Control-Allow-Origin : *";
    }

    # cache emojis
    location ~ /images/emoji/ {
      expires 1y;
      more_set_headers "Cache-Control : public,immutable";
      more_set_headers "Access-Control-Allow-Origin : *";
    }

    location ~ ^/uploads/ {
      # proxy_set_header directives are inherited from the previous configuration
      # level if and only if there are no proxy_set_header directives defined on
      # the current level.
      proxy_set_header X-Request-Start "t=${msec}";

      proxy_set_header X-Sendfile-Type X-Accel-Redirect;
      proxy_set_header X-Accel-Mapping __INSTALL_DIR__/discourse/public/=/downloads/;
      proxy_set_header Client-Ip "";

      include proxy_params_no_auth;
      
      expires 1y;
      more_set_headers "Cache-Control : public,immutable";

      ## optional upload anti-hotlinking rules
      #valid_referers none blocked mysite.com *.mysite.com;
      #if ($invalid_referer) { return 403; }

      # custom CSS
      location ~ /stylesheet-cache/ {
          more_set_headers "Access-Control-Allow-Origin : *";
          try_files $uri =404;
      }

      # this allows us to bypass rails
      location ~* \.(gif|png|jpg|jpeg|bmp|tif|tiff|ico|webp|avif)$ {
          more_set_headers "Access-Control-Allow-Origin : *";
          try_files $uri =404;
      }

      # force attachment so SVGs can't render as a document on direct navigation (does not affect <img>/CSS rendering)
      location ~* \.(svg)$ {
          more_set_headers "Access-Control-Allow-Origin : *";
          more_set_headers "Content-disposition: attachment";
          try_files $uri =404;
      }

      # thumbnails & optimized images
      location ~ /_?optimized/ {
          more_set_headers "Access-Control-Allow-Origin : *";
          try_files $uri =404;
      }

      proxy_pass http://unix:__INSTALL_DIR__/discourse/tmp/sockets/unicorn.sock;
      break;
    }

    location ~ ^/admin/backups/ {
      # proxy_set_header directives are inherited from the previous configuration
      # level if and only if there are no proxy_set_header directives defined on
      # the current level.
      proxy_set_header X-Request-Start "t=${msec}";
      proxy_set_header X-Sendfile-Type X-Accel-Redirect;
      proxy_set_header X-Accel-Mapping __INSTALL_DIR__/discourse/public/=/downloads/;
      proxy_set_header Client-Ip "";

      proxy_pass http://unix:__INSTALL_DIR__/discourse/tmp/sockets/unicorn.sock;
      include proxy_params_no_auth;
      break;
    }

    # This big block is needed so we can selectively enable
    # acceleration for backups, avatars, sprites and so on.
    # see note about repetition above
    location ~ ^/(svg-sprite/|letter_avatar/|letter_avatar_proxy/|user_avatar|highlight-js|stylesheets|theme-javascripts|favicon/proxied|service-worker|extra-locales/) {
      #brotli_comp_level 6;

      # if Set-Cookie is in the response nothing gets cached
      # this is double bad cause we are not passing last modified in
      proxy_ignore_headers "Set-Cookie";
      proxy_hide_header "Set-Cookie";
      proxy_hide_header "X-Discourse-Username";
      proxy_hide_header "X-Runtime";

      # note x-accel-redirect can not be used with proxy_cache
      proxy_cache one;
      proxy_cache_key "$scheme,$host,$request_uri";
      proxy_cache_valid 200 301 302 7d;
      proxy_cache_bypass $bypass_cache;
      proxy_pass http://unix:__INSTALL_DIR__/discourse/tmp/sockets/unicorn.sock;
      include proxy_params_no_auth;
      break;
    }

    # we need buffering off for message bus
    location __PATH__/message-bus/ {
      proxy_buffering off;
      proxy_pass http://unix:__INSTALL_DIR__/discourse/tmp/sockets/unicorn.sock;
      include proxy_params_no_auth;
      break;
    }

    # this means every file in public is tried first
    try_files $uri @__APP__;
  }

  location __PATH__/downloads/ {
    internal;
    alias __INSTALL_DIR__/discourse/public/ ;
  }

  location @__APP__ {
    # fallback to discourse
    include conf.d/__DOMAIN__.d/*.conf;

    # repeat the default proxy_set_header lines from above because we didn't
    # get here via a proxy_pass statement
    proxy_set_header X-Request-Start "t=${msec}";
    
    proxy_set_header X-Sendfile-Type "";
    proxy_set_header X-Accel-Mapping "";
    proxy_set_header Client-Ip "";
    proxy_pass http://unix:__INSTALL_DIR__/discourse/tmp/sockets/unicorn.sock;
    include proxy_params_no_auth;
}